name: Actualizar datos y sitio

# Seguridad (repo público con un bot que escribe en main):
# - Permisos mínimos: por defecto solo lectura; cada job pide únicamente lo que usa.
# - Acciones fijadas por SHA de commit (no por etiqueta, que puede moverse).
# - Dependencias de Python verificadas por hash (requirements-ci.txt) y de npm por lockfile, sin scripts de instalación.
# - Sin pull_request ni pull_request_target: código de forks nunca corre con estos permisos.
# - Ninguna expresión ${{ }} con datos externos se interpola dentro de un script de shell.

on:
  schedule:
    # 7:17 a.m. y 6:17 p.m. hora Colombia (UTC-5), todos los días
    - cron: "17 12,23 * * *"
  workflow_dispatch:
    inputs:
      solo:
        description: "Fuentes a actualizar (vacío = todas)"
        type: choice
        default: todas
        options: [todas, trm, cdt, credito]
  push:
    branches: [main]
    paths: ["site/**", "tasasco/construir.py", ".github/workflows/actualizar.yml"]

permissions:
  contents: read

concurrency:
  group: tasas-co
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # el histórico de crédito se rellena por partes (25 min por corrida)
    permissions:
      contents: write      # para guardar data/ y MOVIMIENTOS.md
    outputs:
      tiene_sitio: ${{ steps.sitio.outputs.existe }}
    env:
      SOLO: ${{ github.event.inputs.solo || 'todas' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main   # siempre la última versión (incluye los datos que acaba de guardar el bot)
          persist-credentials: false   # el token solo existe en los pasos que guardan (GH_TOKEN)

      - id: sitio
        run: echo "existe=$([ -f site/package.json ] && echo si || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias verificadas por hash
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install --no-deps -e .

      - run: python -m pytest -q

      # Cada fuente se guarda apenas termina: si una corrida larga se corta, no se pierde lo descargado
      - name: TRM y usura
        id: trm
        if: github.event_name != 'push' && (env.SOLO == 'todas' || env.SOLO == 'trm')
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # solo en los pasos que descargan
        run: python -m tasasco actualizar --solo trm,tibc

      - name: Guardar TRM y usura
        if: steps.trm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}   # solo en los pasos que hacen push
        run: scripts/guardar.sh "TRM y usura"

      - name: CDT
        id: cdt
        if: github.event_name != 'push' && (env.SOLO == 'todas' || env.SOLO == 'cdt')
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # solo en los pasos que descargan
        run: python -m tasasco actualizar --solo cdt

      - name: Guardar CDT
        if: steps.cdt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}   # solo en los pasos que hacen push
        run: scripts/guardar.sh "CDT"

      - name: Crédito
        id: credito
        if: github.event_name != 'push' && (env.SOLO == 'todas' || env.SOLO == 'credito')
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # solo en los pasos que descargan
        run: python -m tasasco actualizar --solo credito

      - name: Guardar crédito
        if: steps.credito.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}   # solo en los pasos que hacen push
        run: scripts/guardar.sh "crédito"

      - name: Calcular métricas
        if: always()
        run: python -m tasasco construir

      - name: Guardar métricas
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/guardar.sh "métricas"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: datos-sitio
          path: site/public/data
          retention-days: 3

  sitio:
    needs: datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publica aunque una fuente haya fallado: el sitio muestra lo último disponible de cada una
    if: always() && needs.datos.result != 'cancelled' && needs.datos.outputs.tiene_sitio == 'si'
    permissions:
      contents: read
      pages: write       # publicar en GitHub Pages
      id-token: write    # requerido por deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: datos-sitio
          path: site/public/data

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Construir sitio
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Equivale a actions/upload-pages-artifact, pero esa acción usa por dentro upload-artifact sin fijar
      # por SHA, y el repo exige SHA en todas las acciones (Settings → Actions).
      - name: Empaquetar sitio para Pages
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github -C site/dist .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
