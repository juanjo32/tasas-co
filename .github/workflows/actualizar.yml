name: Actualizar datos y sitio

on:
  schedule:
    # 7:17 a.m. y 6:17 p.m. hora Colombia (UTC-5), todos los días
    - cron: "17 12,23 * * *"
  workflow_dispatch:
    inputs:
      solo:
        description: "Fuentes a actualizar (vacío = todas): trm,tibc,cdt,credito"
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "tasasco/construir.py", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tasas-co
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # el histórico de crédito se rellena por partes (25 min por corrida)
    outputs:
      tiene_sitio: ${{ steps.sitio.outputs.existe }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre la última versión (incluye los datos que acaba de guardar el bot)

      - id: sitio
        run: echo "existe=$([ -f site/package.json ] && echo si || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: python -m pytest -q

      # Cada fuente se guarda apenas termina: si una corrida larga se corta, no se pierde lo descargado
      - name: TRM y usura
        if: github.event_name != 'push' && (github.event.inputs.solo == '' || contains(github.event.inputs.solo, 'trm') || contains(github.event.inputs.solo, 'tibc'))
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m tasasco actualizar --solo trm,tibc && scripts/guardar.sh "TRM y usura"

      - name: CDT
        if: github.event_name != 'push' && (github.event.inputs.solo == '' || contains(github.event.inputs.solo, 'cdt'))
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m tasasco actualizar --solo cdt && scripts/guardar.sh "CDT"

      - name: Crédito
        if: github.event_name != 'push' && (github.event.inputs.solo == '' || contains(github.event.inputs.solo, 'credito'))
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m tasasco actualizar --solo credito && scripts/guardar.sh "crédito"

      - name: Calcular métricas
        if: always()
        run: python -m tasasco construir

      - name: Guardar métricas
        if: always() && github.event_name != 'push'
        run: scripts/guardar.sh "métricas"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos-sitio
          path: site/public/data

  sitio:
    needs: datos
    runs-on: ubuntu-latest
    # Publica aunque una fuente haya fallado: el sitio muestra lo último disponible de cada una
    if: always() && needs.datos.result != 'cancelled' && needs.datos.outputs.tiene_sitio == 'si'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: datos-sitio
          path: site/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Construir sitio
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
